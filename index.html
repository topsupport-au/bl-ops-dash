<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painting Checklist</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; font-size: 14px; }
.header { background: #1a1a1a; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 17px; font-weight: 600; }
.header .subtitle { font-size: 11px; color: #aaa; margin-top: 2px; }
.reload-btn { background: #333; color: white; border: 1px solid #555; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.reload-btn:hover { background: #444; }
.tabs { background: white; border-bottom: 2px solid #e0e0e0; display: flex; padding: 0 20px; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 500; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
.tab:hover:not(.active) { color: #444; }
.summary-bar { background: white; border-bottom: 1px solid #e0e0e0; padding: 10px 20px; display: flex; gap: 20px; flex-wrap: wrap; }
.stat .num { font-size: 20px; font-weight: 700; }
.stat .lbl { font-size: 11px; color: #888; }
.content { padding: 16px 20px; }
.date-section { margin-bottom: 18px; }
.date-header { background: #1a1a1a; color: white; padding: 10px 16px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
.date-label { font-size: 14px; font-weight: 600; }
.date-meta { font-size: 11px; color: #bbb; margin-top: 1px; }
.date-count { background: #333; padding: 2px 10px; border-radius: 10px; font-size: 11px; }
.date-overdue .date-header { background: #c0392b; }
.date-today .date-header { background: #e67e22; }
.date-soon .date-header { background: #2980b9; }
.badge { padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.orders-grid { background: white; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.order-row { border-bottom: 1px solid #f0f0f0; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; }
.order-row:last-child { border-bottom: none; }
.order-info { flex: 0 0 150px; }
.customer-name { font-weight: 600; font-size: 13px; }
.order-num { font-size: 11px; color: #aaa; margin-top: 1px; }
.order-size { display: inline-block; background: #f0f0f0; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 600; margin-top: 4px; }
.order-letters { flex: 1; }
.letter-name { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #2c3e50; margin-bottom: 5px; }
.letter-colours { display: flex; flex-wrap: wrap; gap: 4px; }
.letter-chip { display: flex; align-items: center; gap: 4px; background: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 4px; padding: 2px 7px; font-size: 12px; }
.letter-chip .ltr { font-weight: 700; font-size: 13px; min-width: 14px; }
.cdot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0; }
.colour-name { color: #555; text-transform: capitalize; }
.raw-colours { font-size: 11px; color: #999; font-style: italic; margin-top: 3px; word-break: break-word; }
.stage-col { flex: 0 0 160px; }
.stage-pill { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.stage-print { background: #e8f4fd; color: #2980b9; }
.stage-sand { background: #fef9e7; color: #b7950b; }
.stage-paint { background: #fdf2f8; color: #8e44ad; }
.stage-pack { background: #e8f8f0; color: #27ae60; }
.stage-ship { background: #1a1a1a; color: white; }
.stage-dots { display: flex; gap: 3px; margin-top: 5px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; }
.sdot.done { background: #27ae60; }
.sdot.next { background: #e67e22; }
.sdot.todo { background: #ddd; }
.stage-lbl { font-size: 10px; color: #aaa; margin-top: 2px; }
.date-colours { background: #f9f9f9; border-top: 1px solid #eee; padding: 9px 14px; }
.dc-title { font-size: 11px; color: #888; font-weight: 600; margin-bottom: 5px; }
.colour-counts { display: flex; flex-wrap: wrap; gap: 5px; }
.cc-chip { display: inline-flex; align-items: center; gap: 5px; background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 3px 10px; font-size: 12px; }
.cc-chip .cnt { font-weight: 700; }
.colour-section { margin-bottom: 18px; }
.colour-header { padding: 12px 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.colour-title { font-size: 15px; font-weight: 700; text-transform: capitalize; }
.colour-subtitle { font-size: 11px; opacity: 0.75; margin-top: 1px; }
.colour-total { background: rgba(0,0,0,0.15); padding: 2px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.colour-date-block { background: white; border-left: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; }
.colour-date-block:last-child { border-radius: 0 0 8px 8px; }
.colour-date-label { background: #f5f5f5; padding: 7px 14px; font-size: 12px; font-weight: 600; color: #555; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
.dl-count { color: #888; font-weight: 400; }
.letter-items { padding: 8px 14px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.letter-item { display: flex; flex-direction: column; align-items: center; background: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 8px; padding: 8px 10px; min-width: 82px; text-align: center; }
.li-letter { font-size: 22px; font-weight: 800; line-height: 1; }
.li-name { font-size: 10px; color: #444; margin-top: 3px; font-weight: 600; }
.li-word { font-size: 10px; color: #888; }
.li-size { font-size: 10px; color: #aaa; }
.loading { text-align: center; padding: 60px 20px; color: #888; }
.spinner { width: 30px; height: 30px; border: 3px solid #eee; border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { background: #fdecea; border: 1px solid #f5c6c6; border-radius: 8px; padding: 16px; color: #c0392b; }
.no-orders { padding: 30px; text-align: center; color: #888; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🎨 Painting Checklist</h1>
    <div class="subtitle" id="lastUpdated">Bubble Letters — live from Google Sheets</div>
  </div>
  <button class="reload-btn" onclick="loadData()">↻ Refresh</button>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('date',this)">📅 By Delivery Date</div>
  <div class="tab" onclick="switchTab('colour',this)">🎨 By Colour (Bulk Paint)</div>
</div>
<div class="summary-bar" id="summaryBar" style="display:none">
  <div class="stat"><div class="num" id="statOrders">-</div><div class="lbl">Pending orders</div></div>
  <div class="stat"><div class="num" id="statLetters">-</div><div class="lbl">Letters to paint</div></div>
  <div class="stat"><div class="num" id="statColours">-</div><div class="lbl">Colours needed</div></div>
  <div class="stat"><div class="num" id="statUrgent">-</div><div class="lbl">Due ≤3 days</div></div>
</div>
<div class="content">
  <div id="loading" class="loading"><div class="spinner"></div>Loading from Google Sheets…</div>
  <div class="tab-content active" id="tab-date"></div>
  <div class="tab-content" id="tab-colour"></div>
</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyuOvOfPlT3hfnrXm6urnsS88Mo-qKAsT3V5ifutz0Nw9UIBzb3y3aBnFNfoiAgqLKV/exec';
const STAGES = ['Waiting to print','3D Printed','Sanded','Spray paint first coat','Spray paint second coat','Gloss sprayed','Tissue Wrapped','Packed','Shipped'];
const STAGE_GROUP = {'Waiting to print':'print','3D Printed':'print','Sanded':'sand','Spray paint first coat':'paint','Spray paint second coat':'paint','Gloss sprayed':'paint','Tissue Wrapped':'pack','Packed':'pack','Shipped':'ship'};
const COLOURS = {'wine red':'#7B1C1C','pastel pink':'#FFB3C1','dust pink':'#D48C8E','pastel terra':'#C4815E','pastel blue':'#A8C8EA','ocean blue':'#1A7ABF','cream':'#FFF8DC','pastel lilac':'#C9A8D4','sage green':'#87A878','chocolate brown':'#6B3A1F','caramel':'#C68642','forest green':'#2D6A2D','red':'#CC2222','orange':'#FF8C00','yellow':'#FFD700','green':'#22AA22','sky blue':'#87CEEB','purple':'#9B59B6','pink':'#FF69B4'};
const ALIASES = {'wine':'wine red','red wine':'wine red','red whine':'wine red','winered':'wine red','light pink':'pastel pink','pale pink':'pastel pink','baby pink':'pastel pink','pinky pastel':'pastel pink','patel pink':'pastel pink','dusty pink':'dust pink','dusk pink':'dust pink','terra':'pastel terra','terra pastel':'pastel terra','pastel terracotta':'pastel terra','pastel tierra':'pastel terra','pastel erra':'pastel terra','pale blue':'pastel blue','light blue':'pastel blue','dust blue':'pastel blue','dark ocean blue':'ocean blue','navy':'ocean blue','cobalt blue':'ocean blue','creme':'cream','pastel cream':'cream','lilac':'pastel lilac','pastel liliac':'pastel lilac','patel lilac':'pastel lilac','pastel purple':'pastel lilac','sage':'sage green','sagegreen':'sage green','safe green':'sage green','saga green':'sage green','sage greem':'sage green','green sage':'sage green','pastel sage green':'sage green','ocean green':'sage green','pastel green':'sage green','saliegroen':'sage green','choc':'chocolate brown','choc brown':'chocolate brown','chocolate':'chocolate brown','brown':'chocolate brown','forrest green':'forest green','butter yellow':'yellow','pastel yellow':'yellow','wiggly yellow':'yellow','wiggly blue':'sky blue','wiggly red':'red','hot pink':'pink'};
function normalise(raw){if(!raw)return null;let n=String(raw).toLowerCase().trim().replace(/[.,;:]+$/,'').replace(/s+/g,' ');if(COLOURS[n])return n;if(ALIASES[n])return ALIASES[n];const ak=Object.keys(ALIASES).sort((a,b)=>b.length-a.length);for(const k of ak){if(n.includes(k))return ALIASES[k];}const ck=Object.keys(COLOURS).sort((a,b)=>b.length-a.length);for(const k of ck){if(n.includes(k))return k;}return null;}
function hexOf(c){return COLOURS[c]||'#ccc';}
function textOn(hex){const h=hex.replace('#','');if(h.length<6)return '#fff';const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return(0.299*r+0.587*g+0.114*b)/255>0.55?'#1a1a1a':'#ffffff';}
function parseColours(p,word){if(!p||!p.trim())return[];const t=String(p).trim();const allTests=[t.match(/^alls+(.+?)(?:s+fors+al+s+letters?)?$/i),t.match(/^(.+?)s+fors+al+s+letters?$/i),t.match(/^alls+letters?s+(?:ins+)?(.+?)$/i),t.match(/^(.+?)s+fors+all$/i),t.match(/^(.+?)s+(?:ins+)?alls+letters?$/i)];for(const m of allTests){if(m){const cn=normalise(m[1]);if(cn)return word.split('').map(l=>({letter:l,canonical:cn,display:cn}));}}const re=/([A-Z])s*[:-]s*([a-zA-Z][a-zA-Zs]*?)(?=s*[,./
]|s+[A-Z]s*[:-]|$)/gi;const matches=[...t.matchAll(re)];if(matches.length>0){return matches.map(m=>{const raw=m[2].trim().replace(/[,.:]+$/,'').trim();const cn=normalise(raw);return{letter:m[1].toUpperCase(),canonical:cn,display:cn||raw};});}if(!t.includes(',')){const wc=normalise(t);if(wc)return word.split('').map(l=>({letter:l,canonical:wc,display:wc}));}return[{letter:'*',canonical:null,display:t,raw:true}];}
function parseDate(s){if(!s)return new Date(2099,0,1);const str=String(s).trim();if(str.match(/^d{4}-d{2}-d{2}T/)){const d=new Date(str);return new Date(d.getFullYear(),d.getMonth(),d.getDate());}const iso=str.match(/^(d{4})-(d{2})-(d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);const mo={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};const m1=str.match(/^(d+)s+([a-z]+)s+(d{4})$/i);if(m1)return new Date(+m1[3],mo[m1[2].toLowerCase()]??0,+m1[1]);const m2=str.match(/^(d+)/(d+)/(d{4})$/);if(m2)return new Date(+m2[3],+m2[2]-1,+m2[1]);return new Date(2099,0,1);}
function fmtDate(s){const d=parseDate(s);if(d.getFullYear()===2099)return String(s);const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const M=['January','February','March','April','May','June','July','August','September','October','November','December'];return D[d.getDay()]+' '+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();}
function daysUntil(s){const d=parseDate(s),n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/86400000);}
let allOrders=[];
function switchTab(name,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.getElementById('tab-'+name).classList.add('active');}
async function loadData(){document.getElementById('loading').style.display='block';document.getElementById('tab-date').innerHTML='';document.getElementById('tab-colour').innerHTML='';document.getElementById('summaryBar').style.display='none';try{const resp=await fetch(SCRIPT_URL);if(!resp.ok)throw new Error('HTTP '+resp.status);const rows=await resp.json();if(!Array.isArray(rows))throw new Error('Unexpected data format');allOrders=[];for(const r of rows){const orderNum=String(r['Order Number']||'').trim();const contents=String(r['Order Contents']||'').trim();if(!orderNum||!contents)continue;const shipped=String(r['Shipped']||'').trim().toLowerCase();if(shipped==='completed')continue;let nextIdx=0,lastDone=-1;for(let si=0;si<STAGES.length;si++){if(String(r[STAGES[si]]||'').trim().toLowerCase()==='completed')lastDone=si;else{nextIdx=si;break;}}const colours=parseColours(r['Personalisation']||'',contents);allOrders.push({name:String(r['Order Name']||'').trim(),order:orderNum,contents,cm:String(r['CM']||'').trim(),colours,ship:String(r['Shipping Date']||'').trim(),lastDone,nextIdx,nextStage:STAGES[nextIdx],needsPaint:nextIdx<=5});}document.getElementById('lastUpdated').textContent='Last refreshed '+new Date().toLocaleTimeString();render();}catch(e){document.getElementById('loading').style.display='none';document.getElementById('tab-date').innerHTML='<div class="error"><strong>Error loading data:</strong> '+e.message+'</div>';document.getElementById('tab-date').classList.add('active');}}
function render(){document.getElementById('loading').style.display='none';document.getElementById('summaryBar').style.display='';const orders=allOrders.filter(o=>o.needsPaint);let totalLetters=0,colourSet=new Set();for(const o of orders)for(const c of o.colours)if(!c.raw){totalLetters++;if(c.canonical)colourSet.add(c.canonical);}const urgent=orders.filter(o=>daysUntil(o.ship)<=3).length;document.getElementById('statOrders').textContent=orders.length;document.getElementById('statLetters').textContent=totalLetters;document.getElementById('statColours').textContent=colourSet.size;document.getElementById('statUrgent').textContent=urgent;renderDateTab(orders);renderColourTab(orders);}
function stagePill(stage){const g=STAGE_GROUP[stage]||'print';return '<span class="stage-pill stage-'+g+'">'+stage+'</span>';}
function renderDateTab(orders){const byDate={};for(const o of orders){if(!byDate[o.ship])byDate[o.ship]=[];byDate[o.ship].push(o);}const sorted=Object.keys(byDate).sort((a,b)=>parseDate(a)-parseDate(b));if(!sorted.length){document.getElementById('tab-date').innerHTML='<div class="no-orders">🎉 Nothing left to paint!</div>';return;}let html='';for(const date of sorted){const os=byDate[date];const days=daysUntil(date);let dClass='',badge='';if(days<0){dClass='date-overdue';badge='<span class="badge" style="background:#c0392b">'+Math.abs(days)+'d overdue</span>';}else if(days===0){dClass='date-today';badge='<span class="badge" style="background:#e67e22">Today!</span>';}else if(days<=3){dClass='date-soon';badge='<span class="badge" style="background:#2980b9">'+days+'d</span>';}else badge='<span class="badge" style="background:#555">'+days+'d</span>';const tally={};for(const o of os)for(const c of o.colours)if(c.canonical){tally[c.canonical]=(tally[c.canonical]||0)+1;}const tallyArr=Object.entries(tally).sort((a,b)=>b[1]-a[1]);html+='<div class="date-section '+dClass+'"><div class="date-header"><div><div class="date-label">'+fmtDate(date)+'</div><div class="date-meta">'+os.length+' order'+(os.length!==1?'s':'')+' needing paint</div></div><div style="display:flex;gap:8px;align-items:center">'+badge+'<span class="date-count">'+os.length+'</span></div></div><div class="orders-grid">';for(const o of os){const dots=STAGES.map((_,si)=>'<div class="sdot '+(si<o.nextIdx?'done':si===o.nextIdx?'next':'todo')+'"></div>').join('');let colHtml='';if(o.colours.length===1&&o.colours[0].raw){colHtml='<div class="raw-colours">'+o.colours[0].display+'</div>';}else{colHtml='<div class="letter-colours">'+o.colours.map(c=>'<div class="letter-chip"><span class="ltr">'+(c.letter!=='*'?c.letter:'')+'</span><div class="cdot" style="background:'+(c.canonical?hexOf(c.canonical):'#ccc')+'"></div><span class="colour-name">'+(c.display||'?')+'</span></div>').join('')+'</div>';}html+='<div class="order-row"><div class="order-info"><div class="customer-name">'+o.name+'</div><div class="order-num">'+o.order+'</div>'+(o.cm?'<span class="order-size">'+o.cm+'cm</span>':'')+'</div><div class="order-letters"><div class="letter-name">'+o.contents+'</div>'+colHtml+'</div><div class="stage-col">'+stagePill(o.nextStage)+'<div class="stage-dots">'+dots+'</div><div class="stage-lbl">'+o.nextIdx+'/'+STAGES.length+' steps done</div></div></div>';}if(tallyArr.length){html+='<div class="date-colours"><div class="dc-title">🎨 Paint colours needed:</div><div class="colour-counts">';html+=tallyArr.map(([cn,cnt])=>'<div class="cc-chip"><div class="cdot" style="background:'+hexOf(cn)+'"></div><span class="cnt">'+cnt+'×</span>'+cn+'</div>').join('');html+='</div></div>';}html+='</div></div>';}document.getElementById('tab-date').innerHTML=html;}
function renderColourTab(orders){const byDate={};for(const o of orders){if(!byDate[o.ship])byDate[o.ship]={};for(const c of o.colours){if(c.raw||!c.canonical)continue;if(!byDate[o.ship][c.canonical])byDate[o.ship][c.canonical]=[];byDate[o.ship][c.canonical].push({letter:c.letter,name:o.name,contents:o.contents,cm:o.cm});}}const sortedDates=Object.keys(byDate).sort((a,b)=>parseDate(a)-parseDate(b));if(!sortedDates.length){document.getElementById('tab-colour').innerHTML='<div class="no-orders">🎉 Nothing left to paint!</div>';return;}let html='';for(const date of sortedDates){const colourMap=byDate[date];const days=daysUntil(date);let dClass='',badge='';if(days<0){dClass='date-overdue';badge='<span class="badge" style="background:#c0392b">'+Math.abs(days)+'d overdue</span>';}else if(days===0){dClass='date-today';badge='<span class="badge" style="background:#e67e22">Today!</span>';}else if(days<=3){dClass='date-soon';badge='<span class="badge" style="background:#2980b9">'+days+'d</span>';}else badge='<span class="badge" style="background:#555">'+days+'d</span>';const totalLetters=Object.values(colourMap).reduce((s,arr)=>s+arr.length,0);const sortedColours=Object.entries(colourMap).sort((a,b)=>b[1].length-a[1].length);const dateUnknowns=orders.filter(o=>o.ship===date&&o.colours.some(c=>c.raw||!c.canonical));const totalMeta=sortedColours.length+' colour'+(sortedColours.length!==1?'s':'')+' · '+totalLetters+' letters'+(dateUnknowns.length?' · ⚠️ '+dateUnknowns.length+' need review':'');html+='<div class="date-section '+dClass+'"><div class="date-header"><div><div class="date-label">'+fmtDate(date)+'</div><div class="date-meta">'+totalMeta+'</div></div><div style="display:flex;gap:8px;align-items:center">'+badge+'<span class="date-count">'+totalLetters+' letters</span></div></div><div class="orders-grid">';for(const [colour,items] of sortedColours){const bg=hexOf(colour),fg=textOn(bg);const bySize={};for(const it of items){const sz=it.cm||'?';if(!bySize[sz])bySize[sz]=[];bySize[sz].push(it);}const sizeKeys=Object.keys(bySize).sort((a,b)=>parseFloat(a)-parseFloat(b));html+='<div style="border-bottom:1px solid #f0f0f0;padding:10px 14px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;"><div class="cdot" style="background:'+bg+';width:14px;height:14px;border:1px solid rgba(0,0,0,0.15)"></div><span style="font-weight:700;font-size:13px;text-transform:capitalize;">'+colour+'</span><span style="background:'+bg+';color:'+fg+';padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;">'+items.length+' letter'+(items.length!==1?'s':'')+'</span></div>';for(const sz of sizeKeys){const sItems=bySize[sz];const sorted=[...sItems].sort((a,b)=>a.letter.localeCompare(b.letter));html+='<div style="margin-bottom:8px;"><div style="font-size:11px;font-weight:700;color:#888;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px;">'+sz+'cm — '+sItems.length+' letter'+(sItems.length!==1?'s':'')+'</div><div style="display:flex;flex-wrap:wrap;gap:5px;">';for(const it of sorted){html+='<div style="display:flex;flex-direction:column;align-items:center;background:'+bg+';border-radius:6px;padding:6px 9px;min-width:52px;text-align:center;"><div style="font-size:19px;font-weight:800;color:'+fg+';line-height:1;">'+it.letter+'</div><div style="font-size:9px;color:'+fg+';opacity:0.8;margin-top:2px;">'+it.contents+'</div></div>';}html+='</div></div>';}html+='</div>';}if(dateUnknowns.length){html+='<div style="border-top:2px solid #f39c12;"><div style="background:#fff8f0;padding:7px 14px;font-size:11px;font-weight:700;color:#e67e22;">⚠️ Colour to be confirmed — '+dateUnknowns.length+' order'+(dateUnknowns.length!==1?'s':'')+'</div>';for(const o of dateUnknowns){html+='<div class="order-row"><div class="order-info"><div class="customer-name">'+o.name+'</div><div class="order-num">'+o.order+'</div>'+(o.cm?'<span class="order-size">'+o.cm+'cm</span>':'')+'</div><div class="order-letters"><div class="letter-name">'+o.contents+'</div><div class="raw-colours">📝 <strong>Note:</strong> "'+o.colours.map(c=>c.display).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')+'"</div></div></div>';}html+='</div>';}html+='</div></div>';}const unknowns=orders.filter(o=>o.colours.some(c=>c.raw||!c.canonical));if(unknowns.length){html+='<div class="colour-section"><div class="colour-header" style="background:#e67e22;color:#fff"><div style="display:flex;align-items:center;gap:12px"><div style="font-size:20px;line-height:1;">⚠️</div><div><div class="colour-title">Needs Colour Review</div><div class="colour-subtitle">'+unknowns.length+' order'+(unknowns.length!==1?'s':'')+' — colour instructions could not be read automatically</div></div></div><div class="colour-total">'+unknowns.length+'</div></div><div class="orders-grid">';const uByDate={};for(const o of unknowns){if(!uByDate[o.ship])uByDate[o.ship]=[];uByDate[o.ship].push(o);}const uDates=Object.keys(uByDate).sort((a,b)=>parseDate(a)-parseDate(b));for(const date of uDates){html+='<div style="background:#fff8f0;padding:6px 14px;border-bottom:1px solid #fde8d0;font-size:11px;font-weight:700;color:#e67e22;">'+fmtDate(date)+'</div>';for(const o of uByDate[date]){html+='<div class="order-row"><div class="order-info"><div class="customer-name">'+o.name+'</div><div class="order-num">'+o.order+'</div>'+(o.cm?'<span class="order-size">'+o.cm+'cm</span>':'')+'</div><div class="order-letters"><div class="letter-name">'+o.contents+'</div><div class="raw-colours">📝 <strong>Note:</strong> "'+o.colours.map(c=>c.display).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')+'"</div></div></div>';}}html+='</div></div>';}document.getElementById('tab-colour').innerHTML=html;}
