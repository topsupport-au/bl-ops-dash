<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painting Checklist</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; font-size: 14px; }
.header { background: #1a1a1a; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 17px; font-weight: 600; }
.header .subtitle { font-size: 11px; color: #aaa; margin-top: 2px; }
.reload-btn { background: #333; color: white; border: 1px solid #555; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.reload-btn:hover { background: #444; }
.tabs { background: white; border-bottom: 2px solid #e0e0e0; display: flex; padding: 0 20px; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 500; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
.tab:hover:not(.active) { color: #444; }
.summary-bar { background: white; border-bottom: 1px solid #e0e0e0; padding: 10px 20px; display: flex; gap: 20px; flex-wrap: wrap; }
.stat .num { font-size: 20px; font-weight: 700; }
.stat .lbl { font-size: 11px; color: #888; }
.content { padding: 16px 20px; }
.date-section { margin-bottom: 18px; }
.date-header { background: #1a1a1a; color: white; padding: 10px 16px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.date-section.collapsed .date-header { border-radius: 8px; }
.date-label { font-size: 14px; font-weight: 600; }
.date-meta { font-size: 11px; color: #bbb; margin-top: 1px; }
.date-count { background: #333; padding: 2px 10px; border-radius: 10px; font-size: 11px; }
.date-overdue .date-header { background: #c0392b; }
.date-overdue .date-count { background: rgba(0,0,0,0.2); }
.date-today .date-header { background: #e67e22; }
.date-today .date-count { background: rgba(0,0,0,0.2); }
.date-soon .date-header { background: #2980b9; }
.date-soon .date-count { background: rgba(0,0,0,0.2); }
.badge { padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.toggle-arrow { font-size: 13px; opacity: 0.8; transition: transform 0.2s; display: inline-block; margin-left: 6px; }
.date-section.collapsed .toggle-arrow { transform: rotate(-90deg); }
.orders-grid { background: white; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.date-section.collapsed .orders-grid { display: none; }
.order-row { border-bottom: 1px solid #f0f0f0; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; }
.order-row:last-child { border-bottom: none; }
.order-info { flex: 0 0 150px; }
.customer-name { font-weight: 600; font-size: 13px; }
.order-num { font-size: 11px; color: #aaa; margin-top: 1px; }
.order-size { display: inline-block; background: #f0f0f0; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 600; margin-top: 4px; }
.order-letters { flex: 1; }
.letter-name { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #2c3e50; margin-bottom: 5px; }
.letter-colours { display: flex; flex-wrap: wrap; gap: 4px; }
.letter-chip { display: flex; align-items: center; gap: 4px; background: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 4px; padding: 2px 7px; font-size: 12px; }
.letter-chip.lc { border-color: #d0c4f0; background: #f5f0ff; }
.letter-chip .ltr { font-weight: 700; font-size: 13px; min-width: 14px; }
.letter-chip.lc .ltr { font-style: italic; color: #7c4dbd; }
.chip-size { font-size: 10px; color: #aaa; margin-left: 1px; }
.letter-chip.lc .chip-size { color: #9b72d4; }
.cdot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); flex-shrink: 0; }
.colour-name { color: #555; text-transform: capitalize; }
.raw-colours { font-size: 11px; color: #999; font-style: italic; margin-top: 3px; word-break: break-word; }
.stage-col { flex: 0 0 160px; }
.stage-pill { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.stage-print { background: #e8f4fd; color: #2980b9; }
.stage-sand { background: #fef9e7; color: #b7950b; }
.stage-paint { background: #fdf2f8; color: #8e44ad; }
.stage-pack { background: #e8f8f0; color: #27ae60; }
.stage-ship { background: #1a1a1a; color: white; }
.stage-dots { display: flex; gap: 3px; margin-top: 5px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; }
.sdot.done { background: #27ae60; }
.sdot.next { background: #e67e22; }
.sdot.todo { background: #ddd; }
.stage-lbl { font-size: 10px; color: #aaa; margin-top: 2px; }
.date-colours { background: #f9f9f9; border-top: 1px solid #eee; padding: 9px 14px; }
.dc-title { font-size: 11px; color: #888; font-weight: 600; margin-bottom: 5px; }
.colour-counts { display: flex; flex-wrap: wrap; gap: 5px; }
.cc-chip { display: inline-flex; align-items: center; gap: 5px; background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 3px 10px; font-size: 12px; }
.cc-chip .cnt { font-weight: 700; }
.loading { text-align: center; padding: 60px 20px; color: #888; }
.spinner { width: 30px; height: 30px; border: 3px solid #eee; border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { background: #fdecea; border: 1px solid #f5c6c6; border-radius: 8px; padding: 16px; color: #c0392b; }
.no-orders { padding: 30px; text-align: center; color: #888; }
.tab-content { display: none; }
.tab-content.active { display: block; }
/* Trends tab */
.trends-wrap { max-width: 960px; }
.trends-stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.ts { background: white; border-radius: 8px; padding: 14px 18px; flex: 1; min-width: 120px; border: 1px solid #e0e0e0; }
.ts-n { font-size: 26px; font-weight: 700; }
.ts-l { font-size: 11px; color: #888; margin-top: 2px; }
.trends-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 680px) { .trends-grid { grid-template-columns: 1fr; } }
.trends-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; }
.tc-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.lbar-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
.bar-track { flex: 1; background: #f0f0f0; border-radius: 4px; height: 15px; overflow: hidden; display: flex; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-val { font-size: 11px; font-weight: 700; min-width: 22px; text-align: right; color: #555; }
.legend-row { display: flex; gap: 14px; margin-top: 10px; font-size: 11px; color: #888; flex-wrap: wrap; }
.legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.sub-section-title { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 7px; }
.sub-section-title:first-child { margin-top: 0; }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🎨 Painting Checklist</h1>
    <div class="subtitle" id="lastUpdated">Bubble Letters — live from Google Sheets</div>
  </div>
  <button class="reload-btn" onclick="loadData(true)">↻ Refresh</button>
</div>
<div class="tabs">
  <div class="tab active" onclick="switchTab('date',this)">📅 By Delivery Date</div>
  <div class="tab" onclick="switchTab('colour',this)">🎨 By Colour</div>
  <div class="tab" onclick="switchTab('trends',this)">📊 Trends</div>
</div>
<div class="summary-bar" id="summaryBar" style="display:none">
  <div class="stat"><div class="num" id="statOrders">-</div><div class="lbl">Pending paint</div></div>
  <div class="stat"><div class="num" id="statLetters">-</div><div class="lbl">Letters to paint</div></div>
  <div class="stat"><div class="num" id="statColours">-</div><div class="lbl">Colours needed</div></div>
  <div class="stat"><div class="num" id="statUrgent">-</div><div class="lbl">Due ≤3 days</div></div>
</div>
<div class="content">
  <div id="loading" class="loading"><div class="spinner"></div>Loading from Google Sheets…</div>
  <div class="tab-content active" id="tab-date"></div>
  <div class="tab-content" id="tab-colour"></div>
  <div class="tab-content" id="tab-trends"></div>
</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyuOvOfPlT3hfnrXm6urnsS88Mo-qKAsT3V5ifutz0Nw9UIBzb3y3aBnFNfoiAgqLKV/exec';
const STAGES = ['Waiting to print','3D Printed','Sanded','Spray paint first coat','Spray paint second coat','Gloss sprayed','Tissue Wrapped','Packed','Shipped'];
const STAGE_GROUP = {'Waiting to print':'print','3D Printed':'print','Sanded':'sand','Spray paint first coat':'paint','Spray paint second coat':'paint','Gloss sprayed':'paint','Tissue Wrapped':'pack','Packed':'pack','Shipped':'ship'};
const COLOURS = {'wine red':'#7B1C1C','pastel pink':'#FFB3C1','dust pink':'#D48C8E','pastel terra':'#C4815E','pastel blue':'#A8C8EA','ocean blue':'#1A7ABF','cream':'#FFF8DC','pastel lilac':'#C9A8D4','sage green':'#87A878','chocolate brown':'#6B3A1F','caramel':'#C68642','forest green':'#2D6A2D','red':'#CC2222','orange':'#FF8C00','yellow':'#FFD700','green':'#22AA22','sky blue':'#87CEEB','purple':'#9B59B6','pink':'#FF69B4'};
const ALIASES = {'wine':'wine red','red wine':'wine red','red whine':'wine red','winered':'wine red','light pink':'pastel pink','pale pink':'pastel pink','baby pink':'pastel pink','pinky pastel':'pastel pink','patel pink':'pastel pink','dusty pink':'dust pink','dusk pink':'dust pink','terra':'pastel terra','terra pastel':'pastel terra','pastel terracotta':'pastel terra','pastel tierra':'pastel terra','pastel erra':'pastel terra','pale blue':'pastel blue','light blue':'pastel blue','dust blue':'pastel blue','dark ocean blue':'ocean blue','navy':'ocean blue','cobalt blue':'ocean blue','creme':'cream','pastel cream':'cream','lilac':'pastel lilac','pastel liliac':'pastel lilac','patel lilac':'pastel lilac','pastel purple':'pastel lilac','sage':'sage green','sagegreen':'sage green','safe green':'sage green','saga green':'sage green','sage greem':'sage green','green sage':'sage green','pastel sage green':'sage green','ocean green':'sage green','pastel green':'sage green','saliegroen':'sage green','choc':'chocolate brown','choc brown':'chocolate brown','chocolate':'chocolate brown','brown':'chocolate brown','forrest green':'forest green','butter yellow':'yellow','pastel yellow':'yellow','wiggly yellow':'yellow','wiggly blue':'sky blue','wiggly red':'red','hot pink':'pink'};
function normalise(raw){if(!raw)return null;let n=String(raw).toLowerCase().trim().replace(/[.,;:]+$/,'').replace(/\s+/g,' ');if(COLOURS[n])return n;if(ALIASES[n])return ALIASES[n];const ak=Object.keys(ALIASES).sort((a,b)=>b.length-a.length);for(const k of ak){if(n.includes(k))return ALIASES[k];}const ck=Object.keys(COLOURS).sort((a,b)=>b.length-a.length);for(const k of ck){if(n.includes(k))return k;}return null;}
function hexOf(c){return COLOURS[c]||'#ccc';}
function textOn(hex){const h=hex.replace('#','');if(h.length<6)return '#fff';const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);return(0.299*r+0.587*g+0.114*b)/255>0.55?'#1a1a1a':'#ffffff';}
function isLower(ch){return ch!==ch.toUpperCase()&&ch===ch.toLowerCase();}
function letterSize(ch,orderCm){const cm=parseInt(orderCm)||8;return isLower(ch)?cm-1:cm;}
function getCollapsed(){try{return new Set(JSON.parse(localStorage.getItem('bl_collapsed')||'[]'));}catch(e){return new Set();}}
function saveCollapsed(s){localStorage.setItem('bl_collapsed',JSON.stringify([...s]));}
function toggleSection(el){const sec=el.closest('.date-section');const key=sec.dataset.dateKey;const col=getCollapsed();if(col.has(key)){col.delete(key);sec.classList.remove('collapsed');}else{col.add(key);sec.classList.add('collapsed');}saveCollapsed(col);}
function parseColours(p,word){if(!p||!p.trim())return[];const t=String(p).trim();const allTests=[t.match(/^all\s+(.+?)(?:\s+for\s+al+\s+letters?)?$/i),t.match(/^(.+?)\s+for\s+al+\s+letters?$/i),t.match(/^all\s+letters?\s+(?:in\s+)?(.+?)$/i),t.match(/^(.+?)\s+for\s+all$/i),t.match(/^(.+?)\s+(?:in\s+)?all\s+letters?$/i)];for(const m of allTests){if(m){const cn=normalise(m[1]);if(cn)return word.split('').map(l=>({letter:l,canonical:cn,display:cn}));}}const re=/\b([A-Za-z])\s*[:\-]\s*([a-zA-Z][a-zA-Z\s]*?)(?=\s*[,.\/\n]|\s+[A-Za-z]\s*[:\-]|$)/g;const matches=[...t.matchAll(re)];if(matches.length>0){return matches.map(m=>{const raw=m[2].trim().replace(/[,.:]+$/,'').trim();const cn=normalise(raw);return{letter:m[1],canonical:cn,display:cn||raw};});}if(!t.includes(',')){const wc=normalise(t);if(wc)return word.split('').map(l=>({letter:l,canonical:wc,display:wc}));}return[{letter:'*',canonical:null,display:t,raw:true}];}
function parseDate(s){if(!s)return new Date(2099,0,1);const str=String(s).trim();if(str.match(/^\d{4}-\d{2}-\d{2}T/)){const d=new Date(str);return new Date(d.getFullYear(),d.getMonth(),d.getDate());}const iso=str.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return new Date(+iso[1],+iso[2]-1,+iso[3]);const mo={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};const m1=str.match(/^(\d+)\s+([a-z]+)\s+(\d{4})$/i);if(m1)return new Date(+m1[3],mo[m1[2].toLowerCase()]??0,+m1[1]);const m2=str.match(/^(\d+)\/(\d+)\/(\d{4})$/);if(m2)return new Date(+m2[3],+m2[2]-1,+m2[1]);return new Date(2099,0,1);}
function fmtDate(s){const d=parseDate(s);if(d.getFullYear()===2099)return String(s);const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const M=['January','February','March','April','May','June','July','August','September','October','November','December'];return D[d.getDay()]+' '+d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear();}
function daysUntil(s){const d=parseDate(s),n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/86400000);}
let allOrders=[];
function switchTab(name,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));el.classList.add('active');document.getElementById('tab-'+name).classList.add('active');}
function processRows(rows){allOrders=[];for(const r of rows){const orderNum=String(r['Order Number']||'').trim();const contents=String(r['Order Contents']||'').trim();if(!orderNum||!contents)continue;const shipped=String(r['Shipped']||'').trim().toLowerCase();if(shipped==='completed')continue;let nextIdx=0,lastDone=-1;for(let si=0;si<STAGES.length;si++){if(String(r[STAGES[si]]||'').trim().toLowerCase()==='completed')lastDone=si;else{nextIdx=si;break;}}const colours=parseColours(r['Personalisation']||'',contents);allOrders.push({name:String(r['Order Name']||'').trim(),order:orderNum,contents,cm:String(r['CM']||'').trim(),colours,ship:String(r['Shipping Date']||'').trim(),lastDone,nextIdx,nextStage:STAGES[nextIdx],needsPaint:nextIdx<=5});}document.getElementById('loading').style.display='none';document.getElementById('summaryBar').style.display='';render();}
async function loadData(forceSpinner){const cachedStr=localStorage.getItem('bl_ops_data');if(cachedStr&&!forceSpinner){try{const c=JSON.parse(cachedStr);processRows(c.rows);const ago=Math.round((Date.now()-c.ts)/60000);document.getElementById('lastUpdated').textContent='Cached ('+(ago<1?'<1':ago)+'m ago) — refreshing…';}catch(e){}}else{document.getElementById('loading').style.display='block';document.getElementById('tab-date').innerHTML='';document.getElementById('tab-colour').innerHTML='';document.getElementById('tab-trends').innerHTML='';document.getElementById('summaryBar').style.display='none';}try{const resp=await fetch(SCRIPT_URL);if(!resp.ok)throw new Error('HTTP '+resp.status);const rows=await resp.json();if(!Array.isArray(rows))throw new Error('Unexpected data format');localStorage.setItem('bl_ops_data',JSON.stringify({rows,ts:Date.now()}));processRows(rows);document.getElementById('lastUpdated').textContent='Live — '+new Date().toLocaleTimeString();}catch(e){document.getElementById('loading').style.display='none';if(!cachedStr){document.getElementById('tab-date').innerHTML='<div class="error"><strong>Error:</strong> '+e.message+'</div>';document.getElementById('tab-date').classList.add('active');}else{document.getElementById('lastUpdated').textContent+=' (refresh failed)';}}}
function render(){const orders=allOrders.filter(o=>o.needsPaint);let totalLetters=0,colourSet=new Set();for(const o of orders)for(const c of o.colours)if(!c.raw){totalLetters++;if(c.canonical)colourSet.add(c.canonical);}const urgent=orders.filter(o=>daysUntil(o.ship)<=3).length;document.getElementById('statOrders').textContent=orders.length;document.getElementById('statLetters').textContent=totalLetters;document.getElementById('statColours').textContent=colourSet.size;document.getElementById('statUrgent').textContent=urgent;renderDateTab(orders);renderColourTab(orders);renderTrendsTab();}
function stagePill(stage){const g=STAGE_GROUP[stage]||'print';return '<span class="stage-pill stage-'+g+'">'+stage+'</span>';}
function dateSectionOpen(date,dClass,badge,meta,count){const col=getCollapsed();const isCol=col.has(date);const safeKey=date.replace(/&/g,'&amp;').replace(/"/g,'&quot;');return '<div class="date-section '+dClass+(isCol?' collapsed':'')+'" data-date-key="'+safeKey+'"><div class="date-header" onclick="toggleSection(this)"><div><div class="date-label">'+fmtDate(date)+'</div><div class="date-meta">'+meta+'</div></div><div style="display:flex;gap:8px;align-items:center">'+badge+'<span class="date-count">'+count+'</span><span class="toggle-arrow">▼</span></div></div><div class="orders-grid">';}
function renderDateTab(orders){const byDate={};for(const o of orders){if(!byDate[o.ship])byDate[o.ship]=[];byDate[o.ship].push(o);}const sorted=Object.keys(byDate).sort((a,b)=>parseDate(a)-parseDate(b));if(!sorted.length){document.getElementById('tab-date').innerHTML='<div class="no-orders">Nothing left to paint!</div>';return;}let html='';for(const date of sorted){const os=byDate[date];const days=daysUntil(date);let dClass='',badge='';if(days<0){dClass='date-overdue';badge='<span class="badge" style="background:#c0392b">'+Math.abs(days)+'d overdue</span>';}else if(days===0){dClass='date-today';badge='<span class="badge" style="background:#e67e22">Today!</span>';}else if(days<=3){dClass='date-soon';badge='<span class="badge" style="background:#2980b9">'+days+'d</span>';}else badge='<span class="badge" style="background:#555">'+days+'d</span>';const tally={};for(const o of os)for(const c of o.colours)if(c.canonical){tally[c.canonical]=(tally[c.canonical]||0)+1;}const tallyArr=Object.entries(tally).sort((a,b)=>b[1]-a[1]);html+=dateSectionOpen(date,dClass,badge,os.length+' order'+(os.length!==1?'s':'')+' needing paint',os.length);for(const o of os){const dots=STAGES.map((_,si)=>'<div class="sdot '+(si<o.nextIdx?'done':si===o.nextIdx?'next':'todo')+'"></div>').join('');let colHtml='';if(o.colours.length===1&&o.colours[0].raw){colHtml='<div class="raw-colours">'+o.colours[0].display+'</div>';}else{colHtml='<div class="letter-colours">'+o.colours.map(c=>{const lc=isLower(c.letter);const sz=letterSize(c.letter,o.cm);return'<div class="letter-chip'+(lc?' lc':'')+'"><span class="ltr">'+(c.letter!=='*'?c.letter:'')+'</span>'+(c.letter!=='*'?'<span class="chip-size">'+sz+'cm</span>':'')+'<div class="cdot" style="background:'+(c.canonical?hexOf(c.canonical):'#ccc')+'"></div><span class="colour-name">'+(c.display||'?')+'</span></div>';}).join('')+'</div>';}html+='<div class="order-row"><div class="order-info"><div class="customer-name">'+o.name+'</div><div class="order-num">'+o.order+'</div>'+(o.cm?'<span class="order-size">'+o.cm+'cm</span>':'')+'</div><div class="order-letters"><div class="letter-name">'+o.contents+'</div>'+colHtml+'</div><div class="stage-col">'+stagePill(o.nextStage)+'<div class="stage-dots">'+dots+'</div><div class="stage-lbl">'+o.nextIdx+'/'+STAGES.length+' steps done</div></div></div>';}if(tallyArr.length){html+='<div class="date-colours"><div class="dc-title">Paint colours needed:</div><div class="colour-counts">';html+=tallyArr.map(([cn,cnt])=>'<div class="cc-chip"><div class="cdot" style="background:'+hexOf(cn)+'"></div><span class="cnt">'+cnt+'x</span>'+cn+'</div>').join('');html+='</div></div>';}html+='</div></div>';}document.getElementById('tab-date').innerHTML=html;}
function renderColourTab(orders){const byDate={};for(const o of orders){if(!byDate[o.ship])byDate[o.ship]={};for(const c of o.colours){if(c.raw||!c.canonical)continue;const sz=letterSize(c.letter,o.cm)+'cm';if(!byDate[o.ship][c.canonical])byDate[o.ship][c.canonical]={};if(!byDate[o.ship][c.canonical][sz])byDate[o.ship][c.canonical][sz]=[];byDate[o.ship][c.canonical][sz].push({letter:c.letter,lc:isLower(c.letter),name:o.name,contents:o.contents,cm:o.cm});}}const sortedDates=Object.keys(byDate).sort((a,b)=>parseDate(a)-parseDate(b));if(!sortedDates.length){document.getElementById('tab-colour').innerHTML='<div class="no-orders">Nothing left to paint!</div>';return;}let html='';for(const date of sortedDates){const colourMap=byDate[date];const days=daysUntil(date);let dClass='',badge='';if(days<0){dClass='date-overdue';badge='<span class="badge" style="background:#c0392b">'+Math.abs(days)+'d overdue</span>';}else if(days===0){dClass='date-today';badge='<span class="badge" style="background:#e67e22">Today!</span>';}else if(days<=3){dClass='date-soon';badge='<span class="badge" style="background:#2980b9">'+days+'d</span>';}else badge='<span class="badge" style="background:#555">'+days+'d</span>';let totalLetters=0;Object.values(colourMap).forEach(szMap=>Object.values(szMap).forEach(arr=>totalLetters+=arr.length));const sortedColours=Object.entries(colourMap).sort((a,b)=>{const ca=Object.values(a[1]).reduce((s,x)=>s+x.length,0);const cb=Object.values(b[1]).reduce((s,x)=>s+x.length,0);return cb-ca;});const dateUnknowns=orders.filter(o=>o.ship===date&&o.colours.some(c=>c.raw||!c.canonical));const meta=sortedColours.length+' colour'+(sortedColours.length!==1?'s':'')+' · '+totalLetters+' letters'+(dateUnknowns.length?' · '+dateUnknowns.length+' need review':'');html+=dateSectionOpen(date,dClass,badge,meta,totalLetters+' letters');for(const [colour,szMap] of sortedColours){const bg=hexOf(colour),fg=textOn(bg);const sizeKeys=Object.keys(szMap).sort((a,b)=>parseFloat(b)-parseFloat(a));const colTotal=Object.values(szMap).reduce((s,x)=>s+x.length,0);html+='<div style="border-bottom:1px solid #f0f0f0;padding:10px 14px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><div class="cdot" style="background:'+bg+';width:14px;height:14px;border:1px solid rgba(0,0,0,0.15)"></div><span style="font-weight:700;font-size:13px;text-transform:capitalize;">'+colour+'</span><span style="background:'+bg+';color:'+fg+';padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;">'+colTotal+' letter'+(colTotal!==1?'s':'')+'</span><span style="font-size:11px;color:#999;">'+sizeKeys.map(sz=>szMap[sz].length+'× '+sz).join(' · ')+'</span></div>';for(const sz of sizeKeys){const items=[...szMap[sz]].sort((a,b)=>a.letter.localeCompare(b.letter));html+='<div style="margin-bottom:6px;"><div style="font-size:10px;font-weight:700;color:#aaa;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px;">'+sz+'</div><div style="display:flex;flex-wrap:wrap;gap:5px;">';for(const it of items){const ltrStyle=it.lc?'font-style:italic;':'';const lcBorder=it.lc?'border:2px solid rgba(255,255,255,0.45);':'';html+='<div style="display:flex;flex-direction:column;align-items:center;background:'+bg+';border-radius:6px;padding:6px 9px;min-width:52px;text-align:center;'+lcBorder+'"><div style="font-size:19px;font-weight:800;color:'+fg+';line-height:1;'+ltrStyle+'">'+it.letter+'</div><div style="font-size:9px;color:'+fg+';opacity:0.8;margin-top:2px;">'+it.contents+'</div></div>';}html+='</div></div>';}html+='</div>';}if(dateUnknowns.length){html+='<div style="border-top:2px solid #f39c12;"><div style="background:#fff8f0;padding:7px 14px;font-size:11px;font-weight:700;color:#e67e22;">Colour to be confirmed — '+dateUnknowns.length+' order'+(dateUnknowns.length!==1?'s':'')+'</div>';for(const o of dateUnknowns){html+='<div class="order-row"><div class="order-info"><div class="customer-name">'+o.name+'</div><div class="order-num">'+o.order+'</div>'+(o.cm?'<span class="order-size">'+o.cm+'cm</span>':'')+'</div><div class="order-letters"><div class="letter-name">'+o.contents+'</div><div class="raw-colours">Note: "'+o.colours.map(c=>c.display).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')+'"</div></div></div>';}html+='</div>';}html+='</div></div>';}document.getElementById('tab-colour').innerHTML=html;}
function renderTrendsTab(){
  // Aggregate across ALL active (non-shipped) orders
  const letterFreq={},letterUcFreq={},letterLcFreq={},colourFreq={},wordFreq={},sizeFreq={},stageFreq={};
  for(const o of allOrders){
    // Letters
    for(const ch of o.contents){
      if(!/[A-Za-z]/.test(ch))continue;
      const k=ch.toUpperCase();
      letterFreq[k]=(letterFreq[k]||0)+1;
      if(isLower(ch)){letterLcFreq[k]=(letterLcFreq[k]||0)+1;}
      else{letterUcFreq[k]=(letterUcFreq[k]||0)+1;}
    }
    // Colours
    for(const c of o.colours){if(c.canonical)colourFreq[c.canonical]=(colourFreq[c.canonical]||0)+1;}
    // Words/names
    const w=o.contents.trim();if(w)wordFreq[w]=(wordFreq[w]||0)+1;
    // Sizes
    const sz=(parseInt(o.cm)||'?')+'cm';sizeFreq[sz]=(sizeFreq[sz]||0)+1;
    // Pipeline stage
    const sg=STAGE_GROUP[o.nextStage]||'print';stageFreq[sg]=(stageFreq[sg]||0)+1;
  }
  const topColours=Object.entries(colourFreq).sort((a,b)=>b[1]-a[1]);
  const topWords=Object.entries(wordFreq).sort((a,b)=>b[1]-a[1]).slice(0,20);
  const sortedLetters=Object.entries(letterFreq).sort((a,b)=>b[1]-a[1]);
  const maxLF=sortedLetters[0]?.[1]||1;
  const maxCF=topColours[0]?.[1]||1;
  const maxWF=topWords[0]?.[1]||1;
  const totalLetterCount=Object.values(letterFreq).reduce((s,v)=>s+v,0);
  const stageLabels={print:'Printing',sand:'Sanding',paint:'Painting',pack:'Packing',ship:'Ready to ship'};
  const stageColors={print:'#2980b9',sand:'#b7950b',paint:'#8e44ad',pack:'#27ae60',ship:'#555'};
  const maxSZ=Math.max(...Object.values(sizeFreq),1);
  const maxSG=Math.max(...Object.values(stageFreq),1);

  let html='<div class="trends-wrap">';
  // Summary stats row
  html+='<div class="trends-stats">';
  html+='<div class="ts"><div class="ts-n">'+allOrders.length+'</div><div class="ts-l">Active orders</div></div>';
  html+='<div class="ts"><div class="ts-n">'+totalLetterCount+'</div><div class="ts-l">Total letters</div></div>';
  html+='<div class="ts"><div class="ts-n">'+topColours.length+'</div><div class="ts-l">Colours in use</div></div>';
  html+='<div class="ts"><div class="ts-n">'+sortedLetters.length+'</div><div class="ts-l">Unique letters</div></div>';
  html+='</div>';
  // Grid
  html+='<div class="trends-grid">';
  // --- Card 1: Colour popularity ---
  html+='<div class="trends-card"><div class="tc-title">🎨 Colour Popularity</div>';
  if(!topColours.length){html+='<div style="color:#aaa;font-size:13px">No colour data yet</div>';}
  else{for(const [cn,cnt] of topColours){const bg=hexOf(cn);const pct=Math.round(cnt/maxCF*100);html+='<div class="bar-row"><div style="display:flex;align-items:center;gap:6px;width:130px;flex-shrink:0;overflow:hidden"><div class="cdot" style="background:'+bg+'"></div><span style="font-size:12px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+cn+'</span></div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+bg+'"></div></div><span class="bar-val">'+cnt+'</span></div>';}}
  html+='</div>';
  // --- Card 2: Letter demand ---
  html+='<div class="trends-card"><div class="tc-title">🔤 Letter Demand</div>';
  for(const [ltr,cnt] of sortedLetters){const uc=letterUcFreq[ltr]||0;const lc=letterLcFreq[ltr]||0;const ucPct=Math.round(uc/maxLF*100);const lcPct=Math.round(lc/maxLF*100);html+='<div class="lbar-row"><span style="width:14px;font-weight:700;font-size:13px;text-align:center;flex-shrink:0">'+ltr+'</span><div class="bar-track"><div style="width:'+ucPct+'%;height:100%;background:#2c3e50"></div><div style="width:'+lcPct+'%;height:100%;background:#7c4dbd"></div></div><span class="bar-val">'+cnt+'</span></div>';}
  html+='<div class="legend-row"><span><span class="legend-dot" style="background:#2c3e50"></span>Uppercase</span><span><span class="legend-dot" style="background:#7c4dbd"></span>Lowercase</span></div>';
  html+='</div>';
  // --- Card 3: Popular names ---
  html+='<div class="trends-card"><div class="tc-title">✍️ Popular Names / Words</div>';
  if(!topWords.length){html+='<div style="color:#aaa;font-size:13px">No data yet</div>';}
  else{for(const [w,cnt] of topWords){const pct=Math.round(cnt/maxWF*100);html+='<div class="bar-row"><span style="font-weight:700;font-size:12px;letter-spacing:0.5px;width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+w+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:#2c3e50"></div></div><span class="bar-val">'+cnt+'</span></div>';}}
  html+='</div>';
  // --- Card 4: Size + Stage ---
  html+='<div class="trends-card"><div class="tc-title">📏 Sizes &amp; Pipeline</div>';
  html+='<div class="sub-section-title">Order sizes</div>';
  for(const [sz,cnt] of Object.entries(sizeFreq).sort((a,b)=>b[1]-a[1])){const pct=Math.round(cnt/maxSZ*100);html+='<div class="bar-row"><span style="font-weight:700;font-size:12px;width:42px;flex-shrink:0">'+sz+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:#2980b9"></div></div><span class="bar-val">'+cnt+'</span></div>';}
  html+='<div class="sub-section-title">Pipeline stage</div>';
  for(const [sg,cnt] of Object.entries(stageFreq).sort((a,b)=>b[1]-a[1])){const pct=Math.round(cnt/maxSG*100);const sc=stageColors[sg]||'#999';html+='<div class="bar-row"><span style="font-size:12px;width:90px;flex-shrink:0">'+( stageLabels[sg]||sg)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+sc+'"></div></div><span class="bar-val">'+cnt+'</span></div>';}
  html+='</div>';
  html+='</div></div>'; // close trends-grid + trends-wrap
  document.getElementById('tab-trends').innerHTML=html;
}
loadData();
</script>
