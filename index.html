<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painting Checklist</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; font-size: 14px; }

.header { background: #1a1a1a; color: white; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 17px; font-weight: 600; }
.header .subtitle { font-size: 11px; color: #aaa; margin-top: 2px; }
.reload-btn { background: #333; color: white; border: 1px solid #555; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.reload-btn:hover { background: #444; }

.tabs { background: white; border-bottom: 2px solid #e0e0e0; display: flex; padding: 0 20px; }
.tab { padding: 10px 18px; cursor: pointer; font-size: 13px; font-weight: 500; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
.tab:hover:not(.active) { color: #444; }

.summary-bar { background: white; border-bottom: 1px solid #e0e0e0; padding: 10px 20px; display: flex; gap: 20px; flex-wrap: wrap; }
.stat { text-align: center; }
.stat .num { font-size: 20px; font-weight: 700; }
.stat .lbl { font-size: 11px; color: #888; }

.content { padding: 16px 20px; }

/* ── BY DATE tab ── */
.date-section { margin-bottom: 18px; }
.date-header { background: #1a1a1a; color: white; padding: 10px 16px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center; }
.date-label { font-size: 14px; font-weight: 600; }
.date-meta { font-size: 11px; color: #bbb; margin-top: 1px; }
.date-count { background: #333; padding: 2px 10px; border-radius: 10px; font-size: 11px; }
.date-overdue .date-header { background: #c0392b; }
.date-today .date-header { background: #e67e22; }
.date-soon .date-header { background: #2980b9; }
.badge { padding: 2px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }

.orders-grid { background: white; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.order-row { border-bottom: 1px solid #f0f0f0; padding: 11px 14px; display: flex; gap: 10px; align-items: flex-start; }
.order-row:last-child { border-bottom: none; }

.order-info { flex: 0 0 150px; }
.customer-name { font-weight: 600; font-size: 13px; }
.order-num { font-size: 11px; color: #aaa; margin-top: 1px; }
.order-size { display: inline-block; background: #f0f0f0; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-weight: 600; margin-top: 4px; }

.order-letters { flex: 1; }
.letter-name { font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #2c3e50; margin-bottom: 5px; }
.letter-colours { display: flex; flex-wrap: wrap; gap: 4px; }
.letter-chip { display: flex; align-items: center; gap: 4px; background: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 4px; padding: 2px 7px; font-size: 12px; }
.letter-chip .ltr { font-weight: 700; font-size: 13px; min-width: 14px; }
.cdot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0; }
.colour-name { color: #555; }
.raw-colours { font-size: 11px; color: #999; font-style: italic; margin-top: 3px; word-break: break-word; }

.stage-col { flex: 0 0 160px; }
.stage-pill { display: inline-block; padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.stage-print { background: #e8f4fd; color: #2980b9; }
.stage-sand { background: #fef9e7; color: #b7950b; }
.stage-paint { background: #fdf2f8; color: #8e44ad; }
.stage-pack { background: #e8f8f0; color: #27ae60; }
.stage-ship { background: #1a1a1a; color: white; }
.stage-dots { display: flex; gap: 3px; margin-top: 5px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; }
.sdot.done { background: #27ae60; }
.sdot.next { background: #e67e22; }
.sdot.todo { background: #ddd; }
.stage-lbl { font-size: 10px; color: #aaa; margin-top: 2px; }

.date-colours { background: #f9f9f9; border-top: 1px solid #eee; padding: 9px 14px; }
.dc-title { font-size: 11px; color: #888; font-weight: 600; margin-bottom: 5px; }
.colour-counts { display: flex; flex-wrap: wrap; gap: 5px; }
.cc-chip { display: inline-flex; align-items: center; gap: 5px; background: white; border: 1px solid #e0e0e0; border-radius: 12px; padding: 3px 10px; font-size: 12px; }
.cc-chip .cnt { font-weight: 700; }

/* ── BY COLOUR tab ── */
.colour-section { margin-bottom: 18px; }
.colour-header { padding: 12px 16px; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 10px; justify-content: space-between; color: white; }
.colour-swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); flex-shrink: 0; }
.colour-title { font-size: 15px; font-weight: 700; text-transform: capitalize; }
.colour-subtitle { font-size: 11px; opacity: 0.8; margin-top: 1px; }
.colour-total { background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }

.colour-date-block { background: white; border-left: 1px solid #e0e0e0; border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0; }
.colour-date-block:last-child { border-radius: 0 0 8px 8px; }
.colour-date-label { background: #f5f5f5; padding: 7px 14px; font-size: 12px; font-weight: 600; color: #555; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
.colour-date-label .dl-count { color: #888; font-weight: 400; }
.letter-items { padding: 8px 14px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.letter-item { display: flex; flex-direction: column; align-items: center; background: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 6px; padding: 6px 10px; min-width: 80px; }
.li-letter { font-size: 20px; font-weight: 800; color: #1a1a1a; }
.li-name { font-size: 10px; color: #555; text-align: center; margin-top: 2px; }
.li-size { font-size: 10px; color: #888; }
.li-ship { font-size: 9px; color: #aaa; }

/* shared */
.loading { text-align: center; padding: 60px 20px; color: #888; }
.spinner { width: 30px; height: 30px; border: 3px solid #eee; border-top-color: #1a1a1a; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { background: #fdecea; border: 1px solid #f5c6c6; border-radius: 8px; padding: 16px; color: #c0392b; }
.no-orders { padding: 30px; text-align: center; color: #888; }

.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🎨 Painting Checklist</h1>
    <div class="subtitle">Bubble Letters Order Tracking — live from Google Drive</div>
  </div>
  <button class="reload-btn" onclick="loadData()">↻ Refresh</button>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('date',this)">📅 By Delivery Date</div>
  <div class="tab" onclick="switchTab('colour',this)">🎨 By Colour (Bulk Paint)</div>
</div>

<div class="summary-bar" id="summaryBar" style="display:none">
  <div class="stat"><div class="num" id="statOrders">-</div><div class="lbl">Pending orders</div></div>
  <div class="stat"><div class="num" id="statLetters">-</div><div class="lbl">Letters to paint</div></div>
  <div class="stat"><div class="num" id="statColours">-</div><div class="lbl">Paint colours needed</div></div>
  <div class="stat"><div class="num" id="statUrgent">-</div><div class="lbl">Due ≤3 days</div></div>
</div>

<div class="content">
  <div id="loading" class="loading"><div class="spinner"></div>Loading from Google Drive…</div>
  <div class="tab-content active" id="tab-date"></div>
  <div class="tab-content" id="tab-colour"></div>
</div>

<script>
const FILE_ID = '1WSnH684oasgzC09zjjmdCNp-5gttEH3sPNHnCY7_ItU';
const STAGES = ['Waiting to print','3D Printed','Sanded','Spray paint first coat','Spray paint second coat','Gloss sprayed','Tissue Wrapped','Packed','Shipped'];
const STAGE_GROUPS = {
  'Waiting to print':'print','3D Printed':'print','Sanded':'sand',
  'Spray paint first coat':'paint','Spray paint second coat':'paint','Gloss sprayed':'paint',
  'Tissue Wrapped':'pack','Packed':'pack','Shipped':'ship'
};
// Paint stage index (first coat = index 3)
const PAINT_STAGE_IDX = 3;

const COLOUR_MAP = {
  'ocean blue':'#1a7abf','pastel blue':'#7bb7e0','sky blue':'#87ceeb','cobalt blue':'#0047ab',
  'sage green':'#7dba84','pastel green':'#90ee90','olive':'#808000',
  'wine red':'#8b0000','red wine':'#8b0000','wine':'#7b1c1c','burgundy':'#800020',
  'pastel pink':'#ffb6c1','dust pink':'#d4888a','dusty pink':'#d4888a','pink':'#ff69b4','hot pink':'#ff1493',
  'pastel lilac':'#c8a2c8','lilac':'#c8a2c8','pastel purple':'#c8a2c8','purple':'#800080','lavender':'#967bb6',
  'cream':'#fffdd0','white':'#f8f8f8','off white':'#f5f0e8',
  'pastel terra':'#c4825f','terra':'#c0785a','pastel terracotta':'#c4825f','terracotta':'#c4825f',
  'chocolate':'#7b3f00','chocolate brown':'#7b3f00','choc':'#7b3f00','choc brown':'#7b3f00','brown':'#8b4513',
  'pastel yellow':'#fef3b0','yellow':'#ffd700','lemon':'#fff44f',
  'orange':'#ffa500','pastel orange':'#ffcc99',
  'gold':'#cfb53b','antique gold':'#b8860b',
  'black':'#222','charcoal':'#444',
  'grey':'#999','gray':'#999','silver':'#bbb',
  'teal':'#008080','mint':'#98ff98','aqua':'#00ced1',
  'navy':'#001f5b','dark blue':'#00008b',
  'peach':'#ffcba4','coral':'#ff7f50',
};

function getColour(name) {
  if (!name) return '#ddd';
  const n = name.toLowerCase().trim()
    .replace(/pastel terr[a]?cot+a/,'pastel terra')
    .replace(/choc(olate)?\s*br?o?wn?/,'chocolate')
    .replace(/dust(y)?\s*pink/,'dust pink')
    .replace(/red\s*wine/,'wine red');
  for (const [k,v] of Object.entries(COLOUR_MAP)) { if (n.includes(k)) return v; }
  return '#ccc';
}

function textColour(bg) {
  // Choose white or dark text based on background
  const hex = bg.replace('#','');
  if (hex.length < 6) return '#fff';
  const r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
  return lum > 0.55 ? '#1a1a1a' : '#fff';
}

function parseCSV(text) {
  const lines = []; let cur=[], field='', inQ=false;
  for (let i=0;i<text.length;i++) {
    const c=text[i];
    if (inQ) { if (c==='"'&&text[i+1]==='"'){field+='"';i++;} else if(c==='"')inQ=false; else field+=c; }
    else { if(c==='"')inQ=true; else if(c===','){cur.push(field);field='';} else if(c==='\n'){cur.push(field);lines.push(cur);cur=[];field='';} else if(c==='\r'){} else field+=c; }
  }
  if(field||cur.length){cur.push(field);lines.push(cur);}
  return lines;
}

function parseColours(p, letters) {
  if (!p||!p.trim()) return [];
  const t = p.trim();
  // "All X"
  const allM = t.match(/^all\s+(.+)$/i);
  if (allM) return letters.map(l=>({letter:l,colour:allM[1].trim()}));
  const result = [];
  // "L: colour" or "L - colour"
  const re = /\b([A-Z])\s*[:\-]\s*([a-zA-Z][^,\n/]*?)(?=\s*[,\n]|\s+[A-Z]\s*[:\-]|$)/gi;
  const matches = [...t.matchAll(re)];
  if (matches.length > 0) {
    for (const m of matches) result.push({letter:m[1].toUpperCase(), colour:m[2].trim().replace(/[,.:]+$/,'').trim()});
    if (result.length > 0) return result;
  }
  return [{letter:'?', colour:t, raw:true}];
}

function parseDate(s) {
  if (!s) return new Date(2099,0,1);
  const mo = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11,
    january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};
  const m1 = s.trim().match(/^(\d+)\s+([a-z]+)\s+(\d{4})$/i);
  if (m1) return new Date(+m1[3], mo[m1[2].toLowerCase()]??0, +m1[1]);
  const m2 = s.trim().match(/^(\d+)\/(\d+)\/(\d{4})$/);
  if (m2) return new Date(+m2[3], +m2[2]-1, +m2[1]);
  return new Date(2099,0,1);
}

function fmtDate(s) {
  const d = parseDate(s); if (d.getFullYear()===2099) return s;
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mos=['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[d.getDay()]} ${d.getDate()} ${mos[d.getMonth()]} ${d.getFullYear()}`;
}

function daysUntil(s) {
  const d=parseDate(s), now=new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/86400000);
}

let allOrders=[];

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
}

async function loadData() {
  document.getElementById('loading').style.display='block';
  document.getElementById('tab-date').innerHTML='';
  document.getElementById('tab-colour').innerHTML='';
  document.getElementById('summaryBar').style.display='none';

  try {
    const result = await window.cowork.callMcpTool(
      'mcp__37b5c3e6-6993-46a6-816c-c506b3d90369__download_file_content',
      {fileId: FILE_ID, exportMimeType: 'text/csv'}
    );
    let data;
    try { data = result.structuredContent; } catch(e){}
    if (!data && result.content) { try { data=JSON.parse(result.content[0]?.text||result.content); } catch(e){} }
    if (!data) throw new Error('Could not parse response');

    const bytes = Uint8Array.from(atob(data.content), c=>c.charCodeAt(0));
    const csvText = new TextDecoder('utf-8').decode(bytes);
    const rows = parseCSV(csvText);
    if (rows.length < 2) throw new Error('Empty spreadsheet');

    const hdr = {};
    rows[0].forEach((c,i)=>{ hdr[c.trim()]=i; });
    const SI = STAGES.map(s=>hdr[s]??-1);

    allOrders=[];
    for (let ri=1;ri<rows.length;ri++) {
      const r=rows[ri];
      const orderNum=(r[hdr['Order Number']]||'').trim();
      const contents=(r[hdr['Order Contents']]||'').trim();
      if (!orderNum||!contents) continue;
      const shipped=(r[SI[8]]||'').trim().toLowerCase();
      if (shipped==='completed') continue;

      let nextIdx=0, lastDone=-1;
      for (let si=0;si<STAGES.length;si++) {
        if ((r[SI[si]]||'').trim().toLowerCase()==='completed') lastDone=si;
        else { nextIdx=si; break; }
      }
      const colours = parseColours(r[hdr['Personalisation']]||'', contents.split(''));
      const shipDate = (r[hdr['Shipping Date']]||'').trim();

      allOrders.push({
        date:(r[hdr['Order Date']]||'').trim(),
        name:(r[hdr['Order Name']]||'').trim(),
        order:orderNum,
        contents,
        cm:(r[hdr['CM']]||'').trim(),
        colours,
        rawPersonalisation:(r[hdr['Personalisation']]||'').trim(),
        ship:shipDate,
        lastDone, nextIdx,
        nextStage:STAGES[nextIdx],
        needsPaint: nextIdx <= 5, // hasn't finished gloss yet
        paintNotStarted: nextIdx < PAINT_STAGE_IDX, // hasn't done first coat
      });
    }

    render();
  } catch(e) {
    document.getElementById('loading').style.display='none';
    document.getElementById('tab-date').innerHTML=`<div class="error"><strong>Error:</strong> ${e.message}</div>`;
    document.getElementById('tab-date').parentElement.classList.add('active');
  }
}

function render() {
  document.getElementById('loading').style.display='none';
  document.getElementById('summaryBar').style.display='';

  // Only show orders that still need painting (haven't done gloss yet)
  const paintNeeded = allOrders.filter(o => o.needsPaint);

  // Stats
  const paintLetters = paintNeeded.reduce((s,o)=>s+o.colours.filter(c=>!c.raw).length, 0);
  const colourSet = new Set();
  for (const o of paintNeeded) for (const c of o.colours) if (!c.raw && c.colour) colourSet.add(c.colour.toLowerCase().trim());
  const urgent = paintNeeded.filter(o=>daysUntil(o.ship)<=3).length;
  document.getElementById('statOrders').textContent = paintNeeded.length;
  document.getElementById('statLetters').textContent = paintLetters;
  document.getElementById('statColours').textContent = colourSet.size;
  document.getElementById('statUrgent').textContent = urgent;

  renderDateTab(paintNeeded);
  renderColourTab(paintNeeded);
}

function renderDateTab(orders) {
  // Group by ship date
  const byDate = {};
  for (const o of orders) { if (!byDate[o.ship]) byDate[o.ship]=[]; byDate[o.ship].push(o); }
  const sortedDates = Object.keys(byDate).sort((a,b)=>parseDate(a)-parseDate(b));

  if (sortedDates.length===0) {
    document.getElementById('tab-date').innerHTML='<div class="no-orders">🎉 All orders have been painted!</div>';
    return;
  }

  let html='';
  for (const date of sortedDates) {
    const orders = byDate[date];
    const days = daysUntil(date);
    let dClass='', badge='';
    if (days<0) { dClass='date-overdue'; badge=`<span class="badge" style="background:#c0392b">${Math.abs(days)}d overdue</span>`; }
    else if (days===0) { dClass='date-today'; badge=`<span class="badge" style="background:#e67e22">Today!</span>`; }
    else if (days<=3) { dClass='date-soon'; badge=`<span class="badge" style="background:#2980b9">${days}d</span>`; }
    else badge=`<span class="badge" style="background:#555">${days}d</span>`;

    // Colour tally
    const colCount={};
    for (const o of orders) for (const c of o.colours) if (!c.raw&&c.colour) { const k=c.colour.toLowerCase().trim(); colCount[k]=(colCount[k]||0)+1; }
    const sortedCols = Object.entries(colCount).sort((a,b)=>b[1]-a[1]);

    html+=`<div class="date-section ${dClass}">
      <div class="date-header">
        <div><div class="date-label">${fmtDate(date)}</div><div class="date-meta">${orders.length} orders needing paint</div></div>
        <div style="display:flex;gap:8px;align-items:center">${badge}<span class="date-count">${orders.length}</span></div>
      </div>
      <div class="orders-grid">`;

    for (const o of orders) {
      const g = STAGE_GROUPS[o.nextStage]||'print';
      const dots = STAGES.map((s,si)=>`<div class="sdot ${si<o.nextIdx?'done':si===o.nextIdx?'next':'todo'}" title="${s}"></div>`).join('');
      let colHtml='';
      if (o.colours.length===1&&o.colours[0].raw) { colHtml=`<div class="raw-colours">${o.colours[0].colour}</div>`; }
      else { colHtml=`<div class="letter-colours">${o.colours.map(c=>`<div class="letter-chip">${c.letter!=='?'?`<span class="ltr">${c.letter}</span>`:''}<div class="cdot" style="background:${getColour(c.colour)}"></div><span class="colour-name">${c.colour}</span></div>`).join('')}</div>`; }

      html+=`<div class="order-row">
        <div class="order-info">
          <div class="customer-name">${o.name}</div>
          <div class="order-num">${o.order}</div>
          ${o.cm?`<span class="order-size">${o.cm}cm</span>`:''}
        </div>
        <div class="order-letters">
          <div class="letter-name">${o.contents}</div>
          ${colHtml}
        </div>
        <div class="stage-col">
          <span class="stage-pill stage-${g}">${o.nextStage}</span>
          <div class="stage-dots">${dots}</div>
          <div class="stage-lbl">${o.nextIdx}/${STAGES.length} done</div>
        </div>
      </div>`;
    }

    if (sortedCols.length>0) {
      html+=`<div class="date-colours"><div class="dc-title">🎨 Paint colours needed:</div><div class="colour-counts">`;
      html+=sortedCols.map(([col,cnt])=>`<div class="cc-chip"><div class="cdot" style="background:${getColour(col)}"></div><span class="cnt">${cnt}</span> ${col}</div>`).join('');
      html+=`</div></div>`;
    }
    html+=`</div></div>`;
  }
  document.getElementById('tab-date').innerHTML=html;
}

function renderColourTab(orders) {
  // Build: colour → [ {letter, orderName, contents, cm, ship, order} ]
  const byColour = {};
  for (const o of orders) {
    for (const c of o.colours) {
      if (c.raw || !c.colour) continue;
      const key = c.colour.toLowerCase().trim();
      if (!byColour[key]) byColour[key]=[];
      byColour[key].push({ letter:c.letter, name:o.name, order:o.order, contents:o.contents, cm:o.cm, ship:o.ship, nextStage:o.nextStage });
    }
  }

  // Sort colours by count desc
  const sortedColours = Object.entries(byColour).sort((a,b)=>b[1].length-a[1].length);

  if (sortedColours.length===0) {
    document.getElementById('tab-colour').innerHTML='<div class="no-orders">🎉 Nothing left to paint!</div>';
    return;
  }

  let html='';
  for (const [colour, items] of sortedColours) {
    const bg = getColour(colour);
    const fg = textColour(bg);

    // Group items by ship date
    const byDate={};
    for (const item of items) { if (!byDate[item.ship]) byDate[item.ship]=[]; byDate[item.ship].push(item); }
    const sortedDates = Object.keys(byDate).sort((a,b)=>parseDate(a)-parseDate(b));

    html+=`<div class="colour-section">
      <div class="colour-header" style="background:${bg};color:${fg}">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="colour-swatch" style="background:${bg};border-color:${fg==='#fff'?'rgba(255,255,255,0.4)':'rgba(0,0,0,0.2)'}"></div>
          <div>
            <div class="colour-title">${colour}</div>
            <div class="colour-subtitle">${items.length} letter${items.length!==1?'s':''} across ${sortedDates.length} ship date${sortedDates.length!==1?'s':''}</div>
          </div>
        </div>
        <div class="colour-total">${items.length} letters</div>
      </div>`;

    for (const date of sortedDates) {
      const dateItems = byDate[date];
      const days = daysUntil(date);
      let urgencyStyle='';
      if (days<0) urgencyStyle='color:#c0392b;';
      else if (days<=3) urgencyStyle='color:#2980b9;';

      html+=`<div class="colour-date-block">
        <div class="colour-date-label">
          <span style="${urgencyStyle}">${fmtDate(date)}${days<0?` (${Math.abs(days)}d overdue)`:days<=3?` (${days}d away)`:''}</span>
          <span class="dl-count">${dateItems.length} letter${dateItems.length!==1?'s':''}</span>
        </div>
        <div class="letter-items">`;

      for (const item of dateItems) {
        const g=STAGE_GROUPS[item.nextStage]||'print';
        html+=`<div class="letter-item">
          <div class="li-letter" style="color:${bg==='#fffdd0'||bg==='#f8f8f8'?'#333':bg}">${item.letter}</div>
          <div class="li-name">${item.name.split(' ')[0]}</div>
          <div class="li-size">${item.contents}${item.cm?' · '+item.cm+'cm':''}</div>
          <span class="stage-pill stage-${g}" style="font-size:9px;padding:1px 5px;margin-top:3px">${item.nextStage.replace('Spray paint ','')}</span>
        </div>`;
      }
      html+=`</div></div>`;
    }
    html+=`</div>`;
  }
  document.getElementById('tab-colour').innerHTML=html;
}

loadData();
</script>
</body>
</html>
